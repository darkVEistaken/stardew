<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Topluluk Merkezi Takipçisi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --wood:#7a4a24; --wood-d:#4e2c12; --wood-l:#a86a35;
  --parch:#f6e4b5; --parch-d:#e2c786; --ink:#3b2412;
  --green:#5aa02c; --green-d:#33701a; --gold:#f0b93a; --sky:#8fd0ee;
  --done:#cfe8a8;
}
*{box-sizing:border-box}
body{
  margin:0; font-family:'Pixelify Sans',system-ui,sans-serif; color:var(--ink);
  background:
    linear-gradient(180deg,#8fd0ee 0,#cfeaf3 220px,transparent 220px),
    repeating-linear-gradient(90deg,#6fae3c 0 32px,#68a636 32px 64px);
  background-color:#6fae3c; min-height:100vh;
}
header{
  text-align:center; padding:28px 16px 8px;
}
header h1{
  margin:0; font-size:clamp(28px,5vw,48px); color:#fff; letter-spacing:1px;
  text-shadow:0 3px 0 var(--wood-d),0 0 0 #000, 3px 3px 0 var(--wood-d), -2px 2px 0 var(--wood-d);
}
header p{margin:6px 0 0; color:var(--wood-d); font-weight:600}
.wrap{max-width:1180px; margin:0 auto; padding:0 16px 60px}
.panel{
  background:var(--parch); border:4px solid var(--wood-d); border-radius:10px;
  box-shadow:0 0 0 3px var(--wood-l), 0 6px 0 3px var(--wood-d);
}
.overall{margin:20px 0; padding:16px 20px; display:flex; gap:18px; align-items:center; flex-wrap:wrap}
.overall .big{font-size:34px; font-weight:700; min-width:90px}
.bar{flex:1; min-width:200px; height:26px; background:var(--wood-d); border-radius:6px; padding:3px; position:relative}
.bar>i{display:block; height:100%; width:0; background:linear-gradient(var(--green),var(--green-d)); border-radius:4px; transition:width .4s}
.bar.gold>i{background:linear-gradient(#ffd75e,#d89a12)}
.tools{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
input[type=search]{
  font:inherit; padding:8px 12px; border:3px solid var(--wood-d); border-radius:6px; background:#fff8e1; color:var(--ink); width:220px;
}
button{
  font:inherit; font-weight:600; cursor:pointer; padding:8px 14px; color:#fff;
  background:var(--wood); border:3px solid var(--wood-d); border-radius:6px; box-shadow:0 3px 0 var(--wood-d);
}
button:hover{background:var(--wood-l)}
button:active{transform:translateY(2px); box-shadow:0 1px 0 var(--wood-d)}
button.ghost{background:#b5513a}

.rooms{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin-bottom:22px}
.room{
  cursor:pointer; padding:12px 10px; text-align:center; background:var(--wood); color:#fff;
  border:4px solid var(--wood-d); border-radius:10px; box-shadow:0 4px 0 var(--wood-d); transition:transform .1s;
  font:inherit;
}
.room:hover{transform:translateY(-3px); background:var(--wood-l)}
.room.active{background:var(--parch); color:var(--ink); box-shadow:0 0 0 3px var(--gold),0 4px 0 3px var(--wood-d)}
.room .ico{font-size:30px; line-height:1.1}
.room .nm{font-weight:700; font-size:17px}
.room .pg{font-size:14px; opacity:.9}
.room .mini{height:8px; background:rgba(0,0,0,.35); border-radius:4px; margin-top:6px; overflow:hidden}
.room .mini i{display:block; height:100%; background:var(--gold); width:0}
.room.complete .nm::after{content:" ✓"; color:var(--gold)}
.room.active.complete .nm::after{color:var(--green-d)}

.room-head{padding:14px 20px; margin-bottom:18px; display:flex; gap:14px; align-items:center; flex-wrap:wrap}
.room-head h2{margin:0; font-size:26px}
.room-head .rw{margin-left:auto; background:var(--wood); color:#fff; padding:6px 12px; border-radius:6px; border:3px solid var(--wood-d)}

.bundles{display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:18px}
.bundle{padding:0; overflow:hidden; transition:filter .2s}
.bundle.done{background:var(--done)}
.bundle .top{
  display:flex; align-items:center; gap:10px; padding:10px 14px;
  background:linear-gradient(var(--wood-l),var(--wood)); color:#fff; border-bottom:4px solid var(--wood-d);
}
.bundle.done .top{background:linear-gradient(#78b83c,var(--green-d))}
.bundle .top .bi{font-size:26px}
.bundle .top h3{margin:0; font-size:19px; flex:1; text-shadow:1px 1px 0 rgba(0,0,0,.4)}
.bundle .cnt{background:rgba(0,0,0,.35); padding:2px 9px; border-radius:12px; font-size:15px; white-space:nowrap}
.bundle .sub{padding:8px 14px 0; font-size:14px; display:flex; justify-content:space-between; gap:8px; opacity:.85}
.items{display:grid; grid-template-columns:repeat(auto-fill,minmax(88px,1fr)); gap:8px; padding:10px 12px 14px}
.item{
  position:relative; text-align:center; padding:8px 4px 6px; cursor:pointer; user-select:none;
  background:#fff8e1; border:3px solid var(--parch-d); border-radius:8px; font:inherit; color:inherit;
  transition:transform .08s, background .15s;
}
.item:hover{transform:translateY(-2px); border-color:var(--wood-l)}
.item .pic{width:48px; height:48px; margin:0 auto 4px; display:flex; align-items:center; justify-content:center; font-size:30px}
.item img{width:40px; height:40px; image-rendering:pixelated; object-fit:contain}
.item .n{font-size:13px; line-height:1.15; font-weight:600; min-height:30px; display:flex; align-items:center; justify-content:center}
.item .q{position:absolute; top:2px; right:4px; font-size:13px; font-weight:700; background:var(--wood); color:#fff; border-radius:8px; padding:0 6px}
.item .star{position:absolute; top:2px; left:4px; font-size:14px; color:#e8a400; text-shadow:0 0 2px #fff}
.item .chk{
  position:absolute; inset:0; border-radius:5px; display:none; align-items:center; justify-content:center;
  background:rgba(90,160,44,.55); font-size:42px; color:#fff; text-shadow:0 2px 0 var(--green-d);
}
.item.on{background:#e3f4c8; border-color:var(--green)}
.item.on .chk{display:flex}
.item.dim{opacity:.4}
.item.hit{outline:4px solid var(--gold); background:#fff3b0}
.item.hide{display:none}
.bundle.hide{display:none}
.vault .item .pic{font-size:34px}
.foot{text-align:center; margin-top:34px; color:var(--wood-d); font-size:14px}
.foot a{color:var(--wood-d)}

.toast{
  position:fixed; left:50%; bottom:24px; transform:translate(-50%,120px); transition:transform .35s;
  background:var(--parch); border:4px solid var(--wood-d); border-radius:10px; padding:12px 22px; font-weight:700; z-index:9;
  box-shadow:0 4px 0 var(--wood-d);
}
.toast.show{transform:translate(-50%,0)}

.item{padding-bottom:18px}
.item .ssn{position:absolute; left:4px; bottom:2px; font-size:11px; line-height:1}
.item .info{
  position:absolute; right:3px; bottom:3px; width:20px; height:20px; border-radius:50%; background:var(--wood); color:#fff;
  font-size:13px; font-weight:700; display:flex; align-items:center; justify-content:center; border:2px solid var(--wood-d); z-index:2;
}
.item .info:hover{background:var(--gold); color:var(--ink)}
.modal{position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; align-items:center; justify-content:center; z-index:20; padding:16px}
.modal.open{display:flex}
.mcard{max-width:460px; width:100%; max-height:88vh; overflow:auto; padding:18px 20px; position:relative}
.mcard .x{position:absolute; top:8px; right:10px; padding:2px 10px}
.mh{display:flex; gap:12px; align-items:center; margin-bottom:10px}
.mh img{width:56px; height:56px; image-rendering:pixelated; object-fit:contain; background:#fff8e1; border:3px solid var(--parch-d); border-radius:8px; padding:4px}
.mh h3{margin:0; font-size:22px} .mh small{opacity:.7}
.row{display:flex; gap:10px; padding:8px 0; border-top:2px dashed var(--parch-d); line-height:1.35}
.row>span{font-size:20px}
.wl{display:inline-block; margin-top:10px; color:var(--wood-d); font-weight:600}

.tabs{display:flex; gap:8px; margin:14px 0 6px; flex-wrap:wrap; justify-content:center}
.tab{font-size:17px; padding:10px 18px; border-radius:10px 10px 4px 4px}
.tab.active{background:var(--parch); color:var(--ink); box-shadow:0 0 0 3px var(--gold),0 4px 0 3px var(--wood-d)}
[hidden]{display:none !important}
.dim{opacity:.7}
.foot{line-height:1.5}
/* hediyeler */
.gtop{padding:12px 16px; margin:16px 0 14px; display:flex; gap:14px; align-items:center; flex-wrap:wrap}
.gtop select,.gtools select{font:inherit; padding:6px 8px; border:3px solid var(--wood-d); border-radius:6px; background:#fff8e1; color:var(--ink)}
.gbtns{display:flex; gap:8px; flex-wrap:wrap}
.gstat{margin-left:auto}
.bday{padding:10px 16px; margin-bottom:12px; background:#fff0a8}
.bsoon{padding:10px 16px; margin-bottom:12px}
.bchip{display:inline-flex; align-items:center; gap:4px; background:#fff; border:2px solid var(--gold); border-radius:20px; padding:0 10px 0 4px; font-weight:700}
.mini{width:26px; height:26px; image-rendering:pixelated}
.gtools{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px}
.vgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px}
.vcard{padding:12px 14px}
.vcard.full{background:var(--done)}
.vcard.isb{box-shadow:0 0 0 3px var(--gold),0 6px 0 3px var(--wood-d)}
.vh{display:flex; gap:10px; align-items:center; margin-bottom:8px}
.vh .por{width:56px; height:56px; object-fit:contain; image-rendering:pixelated; background:#fff8e1; border:3px solid var(--parch-d); border-radius:8px}
.vh h3{margin:0; font-size:20px} .vh small{opacity:.8}
.vbtn{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px}
.tg{background:#b9a06a; border-color:#7d6a3e; box-shadow:0 3px 0 #7d6a3e; padding:8px 4px; font-size:15px}
.tg.on{background:var(--green); border-color:var(--green-d); box-shadow:0 3px 0 var(--green-d)}
.vmeta{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; font-size:15px}
.hrt button{padding:0 8px; font-size:15px; box-shadow:0 2px 0 var(--wood-d)}
.hrt b.ok{color:var(--green-d)}
.lt{font-size:13px; opacity:.75}
.loves{display:flex; flex-wrap:wrap; gap:6px; margin-top:4px}
.gi{display:inline-flex; align-items:center; gap:4px; background:#fff8e1; border:2px solid var(--parch-d); border-radius:16px; padding:1px 8px 1px 2px; font-size:13px; line-height:1.1}
.gi img{width:24px; height:24px; image-rendering:pixelated; object-fit:contain}
/* mükemmeliyet */
.poverall{padding:16px 20px; margin:16px 0 10px; display:flex; gap:18px; align-items:center; flex-wrap:wrap}
.poverall .big{font-size:36px; font-weight:700; min-width:120px}
.poverall .bar{flex:1; min-width:200px}
.bar.gold>i{background:linear-gradient(#ffd75e,#d89a12)}
.note{margin:0 4px 14px; font-size:14px; color:var(--wood-d)}
.pgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:16px; align-items:start}
.pcard{padding:12px 14px}
.pcard.done{background:var(--done)}
.ph{display:flex; align-items:center; gap:8px; margin-bottom:6px}
.ph h3{margin:0; font-size:19px; flex:1}
.pw{background:var(--wood); color:#fff; border-radius:10px; padding:0 8px; font-size:14px}
.pv{font-weight:700}
.pbar{height:12px; background:var(--wood-d); border-radius:6px; padding:2px; margin-bottom:8px}
.pbar i{display:block; height:100%; background:linear-gradient(var(--green),var(--green-d)); border-radius:4px}
.hint{font-size:14px; margin:8px 0 0; opacity:.9; line-height:1.4}
.hint a,.foot a{color:var(--wood-d)}
.cnt{display:flex; gap:6px; align-items:center; flex-wrap:wrap}
.cnt input{width:76px; font:inherit; text-align:center; padding:6px; border:3px solid var(--wood-d); border-radius:6px; background:#fff8e1}
.cnt button,.skr button{padding:4px 9px; box-shadow:0 2px 0 var(--wood-d)}
.cks{display:grid; gap:6px}
.ck{display:flex; align-items:flex-start; gap:8px; padding:6px 8px; background:#fff8e1; border:2px solid var(--parch-d); border-radius:8px; cursor:pointer; line-height:1.25}
.ck input{display:none}
.ck .bx{width:22px; height:22px; flex:none; border:3px solid var(--wood-d); border-radius:5px; background:#fff; color:transparent; display:flex; align-items:center; justify-content:center; font-size:15px; margin-top:1px}
.ck.on{background:#e3f4c8; border-color:var(--green)}
.ck.on .bx{background:var(--green); border-color:var(--green-d); color:#fff}
.ck .tx small{display:block; font-size:13px; opacity:.75}
.sk{display:grid; gap:6px}
.skr{display:flex; align-items:center; gap:8px}
.skr span{flex:1}
.pend{display:flex; flex-wrap:wrap; gap:6px; font-size:14px; margin:8px 0}
.pend>b{width:100%}
.pend span{background:#fff8e1; border:2px solid var(--parch-d); border-radius:14px; padding:0 8px}
.ok{color:var(--green-d); font-weight:700}
.go{margin-top:6px}
.sec{margin:28px 4px 12px; color:var(--wood-d); text-shadow:0 1px 0 #fff8}
@media(max-width:560px){ .bundles{grid-template-columns:1fr} .overall .big{font-size:28px} input[type=search]{width:100%} }
</style>
</head>
<body>
<header>
  <h1 id="h1">🌾 Topluluk Merkezi 🌾</h1>
  <p>Stardew Valley yardımcın — işaretle, takip et, unutma!</p>
</header>

<div class="wrap">
  <nav class="tabs"><button class="tab active" data-view="cc">🏛️ Topluluk Merkezi</button><button class="tab" data-view="perf">🏆 Mükemmeliyet</button><button class="tab" data-view="gift">🎁 Hediyeler</button></nav>
  <div id="v-cc">
  <div class="panel overall">
    <div class="big" id="ovPct">0%</div>
    <div class="bar" id="ovBar"><i></i></div>
    <div id="ovTxt">0 / 30 paket</div>
    <div class="tools">
      <input type="search" id="q" placeholder="🔍 Eşya ara… (ör. Yaban Havucu)">
      <button class="ghost" id="reset">Sıfırla</button>
    </div>
  </div>

  <div class="rooms" id="rooms"></div>
  <div class="panel room-head" id="roomHead"></div>
  <div class="bundles" id="bundles"></div>

  <div class="foot">
    <b>i</b> butonu: nerede, saat, mevsim, hava. İlerlemen tarayıcında otomatik kaydedilir. Görseller ve veriler
    <a href="https://tr.stardewvalleywiki.com/Y%C4%B1%C4%9F%C4%B1nlar" target="_blank" rel="noopener">Stardew Valley Wiki</a>'den alınmıştır; eşya adları oyunun Türkçe çevirisine göre.
  </div>
  </div><!-- v-cc -->
  <div id="v-perf" hidden></div>
  <div id="v-gift" hidden></div>
</div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="panel mcard"><button class="x" data-close>✕</button><div id="mBody"></div></div></div>

<script>
const WIKI = 'https://stardewvalleywiki.com/Special:FilePath/';
// i(name, qty, opts) -> item. opts: {img, gold(altın kalite), emoji}
const i = (n, q = 1, o = {}) => ({ n, q, ...o });
const G = { gold: true };

const ROOMS = [
 { id:'crafts', name:'Crafts Room', ico:'🪵', reward:'Ödül: Köprü onarımı (Quarry)', bundles:[
  { name:'Spring Foraging', ico:'🌸', reward:'30 Spring Seeds', need:4, items:[i('Wild Horseradish'),i('Daffodil'),i('Leek'),i('Dandelion')] },
  { name:'Summer Foraging', ico:'☀️', reward:'30 Summer Seeds', need:3, items:[i('Grape'),i('Spice Berry'),i('Sweet Pea')] },
  { name:'Fall Foraging', ico:'🍂', reward:'30 Fall Seeds', need:4, items:[i('Common Mushroom'),i('Wild Plum'),i('Hazelnut'),i('Blackberry')] },

  { name:'Summer Crops', ico:'🍅', reward:'Quality Sprinkler', need:4, items:[i('Tomato'),i('Hot Pepper'),i('Blueberry'),i('Melon')] },
  { name:'Fall Crops', ico:'🎃', reward:'Bee House', need:4, items:[i('Corn'),i('Eggplant'),i('Pumpkin'),i('Yam')] },

  { name:'Animal', ico:'🐄', reward:'Cheese Press', need:5, items:[i('Large Milk'),i('Large Egg (Brown)'),i('Large Egg (White)'),i('Large Goat Milk'),i('Wool'),i('Duck Egg')] },
  { name:'Artisan', ico:'🍯', reward:'Keg', need:6, items:[i('Truffle Oil'),i('Cloth'),i('Goat Cheese'),i('Cheese'),i('Honey'),i('Jelly'),i('Apple'),i('Apricot'),i('Orange'),i('Peach'),i('Pomegranate'),i('Cherry')] },
 ]},
 { id:'fish', name:'Fish Tank', ico:'🐟', reward:'Ödül: Panning (Glittering Boulder) açılır', bundles:[
  { name:'River Fish', ico:'🏞️', reward:'30 Bait', need:4, items:[i('Sunfish'),i('Catfish'),i('Shad'),i('Tiger Trout')] },
  { name:'Lake Fish', ico:'🌊', reward:'Dressed Spinner', need:4, items:[i('Largemouth Bass'),i('Carp'),i('Bullhead'),i('Sturgeon')] },
  { name:'Ocean Fish', ico:'🐠', reward:'Warp Totem: Beach x5', need:4, items:[i('Sardine'),i('Tuna'),i('Red Snapper'),i('Tilapia')] },
  { name:'Night Fishing', ico:'🌙', reward:'Small Glow Ring', need:3, items:[i('Walleye'),i('Bream'),i('Eel')] },
  { name:'Specialty Fish', ico:'🎣', reward:'5 Dish O\' The Sea', need:4, items:[i('Pufferfish'),i('Ghostfish'),i('Sandfish'),i('Woodskip')] },
  { name:'Crab Pot', ico:'🦀', reward:'3 Crab Pot', need:5, items:[i('Lobster'),i('Crayfish'),i('Crab'),i('Cockle'),i('Mussel'),i('Shrimp'),i('Snail'),i('Periwinkle'),i('Oyster'),i('Clam')] },
 ]},
 { id:'boiler', name:'Boiler Room', ico:'🔥', reward:'Ödül: Minecart ulaşımı açılır', bundles:[
  { name:'Blacksmith\'s', ico:'⚒️', reward:'Furnace', need:3, items:[i('Copper Bar'),i('Iron Bar'),i('Gold Bar')] },
  { name:'Geologist\'s', ico:'💎', reward:'Omni Geode x5', need:4, items:[i('Quartz'),i('Earth Crystal'),i('Frozen Tear'),i('Fire Quartz')] },
  { name:'Adventurer\'s', ico:'⚔️', reward:'Small Magnet Ring', need:2, items:[i('Slime',99),i('Bat Wing',10),i('Solar Essence'),i('Void Essence')], needNote:'4\'ten 2\'si' },
 ]},
 { id:'bulletin', name:'Bulletin Board', ico:'📌', reward:'Ödül: Mağaza ve arkadaşlık bonusları', bundles:[
  { name:'Chef\'s', ico:'👨‍🍳', reward:'Pink Cake', need:6, items:[i('Maple Syrup'),i('Fiddlehead Fern'),i('Truffle'),i('Poppy'),i('Maki Roll'),i('Fried Egg')] },
  { name:'Dye', ico:'🎨', reward:'Seed Maker', need:6, items:[i('Red Mushroom'),i('Sea Urchin'),i('Sunflower'),i('Duck Feather'),i('Aquamarine'),i('Red Cabbage')] },
  { name:'Field Research', ico:'🔬', reward:'Recycling Machine', need:4, items:[i('Purple Mushroom'),i('Nautilus Shell'),i('Chub'),i('Frozen Geode')] },
  { name:'Fodder', ico:'🌾', reward:'Heater', need:3, items:[i('Wheat',10),i('Hay',10),i('Apple',3)] },
  { name:'Enchanter\'s', ico:'🔮', reward:'Gold Bar x5', need:4, items:[i('Oak Resin'),i('Wine'),i('Rabbit\'s Foot'),i('Pomegranate')] },
 ]},
 { id:'vault', name:'Vault', ico:'💰', reward:'Ödül: Otobüs onarımı (Calico Desert)', vault:true, bundles:[
  { name:'2,500g', ico:'🪙', reward:'3 Chocolate Cake', need:1, items:[i('2,500g',1,{img:'Gold.png',emoji:'🪙'})] },
  { name:'5,000g', ico:'🪙', reward:'30 Quality Fertilizer', need:1, items:[i('5,000g',1,{img:'Gold.png',emoji:'🪙'})] },
  { name:'10,000g', ico:'🪙', reward:'30 Lightning Rod', need:1, items:[i('10,000g',1,{img:'Gold.png',emoji:'🪙'})] },
  { name:'25,000g', ico:'🪙', reward:'Crystalarium', need:1, items:[i('25,000g',1,{img:'Gold.png',emoji:'🪙'})] },

function renderRooms() {
  $('#rooms').innerHTML = ROOMS.map(r => {
    const d = r.bundles.filter(b => bundleDone(r, b)).length;
    return `<button class="room ${r.id === cur ? 'active' : ''} ${roomDone(r) ? 'complete' : ''}" data-room="${r.id}">
      <div class="ico">${r.ico}</div><div class="nm">${RN[r.id][0]}</div>
      <div class="pg">${d} / ${r.bundles.length}</div>
      <div class="mini"><i style="width:${d / r.bundles.length * 100}%"></i></div></button>`;
  }).join('');
}

function renderOverall() {
  const d = doneCount(), t = total(), p = Math.round(d / t * 100);
  $('#ovPct').textContent = p + '%';
  $('#ovBar').firstElementChild.style.width = p + '%';
  $('#ovBar').classList.toggle('gold', d === t);
  $('#ovTxt').textContent = d === t ? '🎉 Topluluk Merkezi tamamlandı!' : `${d} / ${t} paket`;
}

function renderBundles() {
  const r = ROOMS.find(x => x.id === cur);
  $('#roomHead').innerHTML = `<h2>${r.ico} ${RN[r.id][0]}</h2><span>${r.bundles.filter(b => bundleDone(r, b)).length}/${r.bundles.length} paket</span><span class="rw">${RN[r.id][1]}</span>`;
  const box = $('#bundles');
  box.className = 'bundles' + (r.vault ? ' vault' : '');
  box.innerHTML = r.bundles.map((b, bi) => {
    const c = checked(r, b), done = c >= b.need;
    const needTxt = b.need === b.items.length ? `Hepsi (${b.need})` : `${b.items.length} eşyadan ${b.need}`;
    return `<section class="panel bundle ${done ? 'done' : ''}" data-b="${bi}">
      <div class="top"><span class="bi">${b.ico}</span><h3>${BN[b.name] || b.name}</h3><span class="cnt">${Math.min(c, b.need)}/${b.need}</span></div>
      <div class="sub"><span>${needTxt}</span><span>🎁 ${RW[b.name] || b.reward}</span></div>
      <div class="items">${b.items.map((it, idx) => {
        const on = !!state[iid(r, b, it, idx)];
        const dim = done && !on;
        return `<button class="item ${on ? 'on' : ''} ${dim ? 'dim' : ''}" data-i="${idx}" data-name="${(it.n + ' ' + tn(it)).toLowerCase()}" title="${tn(it)}${it.q > 1 ? ' ×' + it.q : ''}">
          ${it.gold ? '<span class="star">★</span>' : ''}${it.q > 1 ? `<span class="q">×${it.q}</span>` : ''}

          <div class="n">${tn(it)}</div>${seasonBadge(it)}<span class="info" data-info="${idx}" title="Detay">i</span><span class="chk">✔</span></button>`;
      }).join('')}</div></section>`;
  }).join('');
  box.querySelectorAll('img').forEach(im => im.addEventListener('error', () => {
    // wiki zaman zaman 503 veriyor: bir kez tekrar dene, olmazsa emoji göster
    if (!im.dataset.retry) { im.dataset.retry = 1; const s = im.src; setTimeout(() => { im.src = s + '?r=1'; }, 1500); return; }
    im.replaceWith(Object.assign(document.createElement('span'), { textContent: im.dataset.emoji }));
  }));
  applySearch();
}


function openInfo(it) {
  const i = infoOf(it.n) || {};
  const sez = i.s ? (i.s === 'x' ? 'Tüm mevsimler' : seasonKeys(i.s).map(k => SEZ[k]).join(', ')) : '';
  const hv = i.h && (i.h === 'Güneşli' ? '☀️ Güneşli' : i.h === 'Yağmurlu' ? '🌧️ Yağmurlu' : '🌤️ ' + i.h);
  const rows = [['📍', 'Nerede / Nasıl', i.w], ['🕐', 'Saat', i.t], ['📅', 'Mevsim', sez], ['🌦️', 'Hava', hv], ['📝', 'Not', i.n]]
    .filter(r => r[2]).map(r => `<div class="row"><span>${r[0]}</span><div><b>${r[1]}</b><br>${r[2]}</div></div>`).join('');
  const extra = it.gold ? '<div class="row"><span>⭐</span><div><b>Kalite</b><br>Altın kalite olmalı</div></div>' : '';
  const page = (FILE[it.n] || it.n).replace(/ \(.*\)/, '').replace(/ /g, '_');
  $('#mBody').innerHTML = `<div class="mh"><img src="${imgUrl(it)}" alt=""><div><h3>${tn(it)}</h3><small>${it.n}${it.q > 1 ? ' · ×' + it.q : ''}</small></div></div>${rows}${extra}
    <a class="wl" target="_blank" rel="noopener" href="https://stardewvalleywiki.com/${encodeURIComponent(page)}">Wiki'de aç ↗</a>`;
  $('#modal').classList.add('open');
}
document.addEventListener('click', e => { if (e.target.closest('[data-close]') || e.target.id === 'modal') $('#modal').classList.remove('open'); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#modal').classList.remove('open'); });

function applySearch() {
  const q = $('#q').value.trim().toLowerCase();
  document.querySelectorAll('.item').forEach(el => el.classList.toggle('hit', !!q && el.dataset.name.includes(q)));
  if (q) {
    // eşleşen eşyası olan odaları vurgula, mevcut odada eşleşmeyenleri soluklaştır
    document.querySelectorAll('.bundle').forEach(b => b.classList.toggle('hide', !b.querySelector('.item.hit')));
  } else document.querySelectorAll('.bundle').forEach(b => b.classList.remove('hide'));
}

function refresh(keepScroll) { renderRooms(); renderOverall(); renderBundles(); }

document.addEventListener('click', e => {
  const room = e.target.closest('[data-room]');
  if (room) { cur = room.dataset.room; refresh(); return; }
  const inf = e.target.closest('.info');
  if (inf) {
    const r = ROOMS.find(x => x.id === cur), bi = +inf.closest('.bundle').dataset.b;
    openInfo(r.bundles[bi].items[+inf.dataset.info]); return;
  }
  const item = e.target.closest('.item');
  if (item) {
    const r = ROOMS.find(x => x.id === cur);
    const bi = +item.closest('.bundle').dataset.b, b = r.bundles[bi], idx = +item.dataset.i;
    const k = iid(r, b, b.items[idx], idx), wasDone = bundleDone(r, b), wasRoom = roomDone(r), wasAll = doneCount() === total();
    if (state[k]) delete state[k]; else state[k] = 1;
    save();
    const y = scrollY; refresh(); scrollTo(0, y);
    if (!wasDone && bundleDone(r, b)) toast(`✨ ${BN[b.name] || b.name} yığını tamamlandı! Ödül: ${RW[b.name]}`);

    if (!wasAll && doneCount() === total()) toast('🎉 Tüm Topluluk Merkezi tamamlandı! Junimo\'lar çok mutlu!');
  }
});
$('#q').addEventListener('input', applySearch);
$('#reset').addEventListener('click', () => {
  if (confirm('Tüm ilerleme silinsin mi?')) { state = {}; save(); refresh(); }
});
refresh();

function renderGift() {
  const el = $('#v-gift'), D = GS.date;

    if (gFilter === 'done' && !s.g) return false;

function vcard(v) {
  const s = GS.v[v.id] || { t: 0, g: 0, w: 0, h: 0 }, n = daysUntil(v), mh = maxHearts(v);
  const full = s.t && s.g;
  return `<section class="panel vcard ${full ? 'full' : ''} ${n === 0 ? 'isb' : ''}" data-v="${v.id}">
    <div class="vh">${pimg(v.pic, '👤', 'por')}<div><h3>${v.n}</h3><small>🎂 ${SI[v.s]} ${SN[v.s]} ${v.d} · ${untilTxt(n)}</small></div></div>
    <div class="vbtn">
      <button class="tg ${s.t ? 'on' : ''}" data-act="t">${s.t ? '✔' : '💬'} Konuştum</button>
      <button class="tg ${s.g ? 'on' : ''}" data-act="g">${s.g ? '✔' : '🎁'} Hediye verdim</button>
    </div>
    <div class="vmeta"><span title="Bu hafta verilen hediye">📦 Hafta: <b>${s.w}/2</b></span>
      <span class="hrt"><button data-act="hm">−</button> ❤ <b class="${s.h >= mh ? 'ok' : ''}">${s.h}/${mh}</b> <button data-act="hp">+</button></span></div>
    <div class="lv"><span class="lt">Sevdiği hediyeler</span><div class="loves">${v.love.map(l => `<span class="gi" title="${esc(l)}">${GP[l] ? pimg(GP[l], '🎁') : '🎁'}<span>${l}</span></span>`).join('')}</div></div>
  </section>`;
}
(function giftEvents() {
  const el = $('#v-gift');
  el.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.id === 'gNew') {
      Object.values(GS.v).forEach(s => { s.t = 0; s.g = 0; });
      let d = GS.date.d + 1, k = SK.indexOf(GS.date.s);
      if (d > 28) { d = 1; k = (k + 1) % 4; }
      GS.date = { s: SK[k], d };
      if (d % 7 === 1) Object.values(GS.v).forEach(s => { s.w = 0; });   // 1., 8., 15., 22. gün = Pazartesi
      gSave(); renderGift(); return;
    }
    if (b.id === 'gClr') { Object.values(GS.v).forEach(s => { s.t = 0; s.g = 0; }); gSave(); renderGift(); return; }
    if (b.id === 'gWk') { Object.values(GS.v).forEach(s => { s.w = 0; }); gSave(); renderGift(); return; }
    const card = b.closest('.vcard'); if (!card || !b.dataset.act) return;
    const v = VIL.find(x => x.id === card.dataset.v), s = gv(v.id), a = b.dataset.act;
    if (a === 't') s.t = s.t ? 0 : 1;
    if (a === 'g') { s.g = s.g ? 0 : 1; s.w = clamp(s.w + (s.g ? 1 : -1), 0, 2); }
    if (a === 'hp') s.h = clamp(s.h + 1, 0, 10);
    if (a === 'hm') s.h = clamp(s.h - 1, 0, 10);
    gSave();
    const y = scrollY; renderGift(); scrollTo(0, y);
  });
  el.addEventListener('change', e => {
    if (e.target.id === 'gS') GS.date.s = e.target.value;
    else if (e.target.id === 'gD') GS.date.d = +e.target.value;
    else if (e.target.id === 'gF') gFilter = e.target.value;
    else if (e.target.id === 'gO') gSort = e.target.value;
    else return;
    gSave(); renderGift();
  });
  el.addEventListener('input', e => {
    if (e.target.id !== 'gQ') return;
    gSearch = e.target.value; const pos = e.target.selectionStart; renderGift();
    const q = $('#gQ'); q.focus(); q.setSelectionRange(pos, pos);
  });
})();

function pcount(k, max) { return clamp(+PS.n[k] || 0, 0, max); }
function perfScore() {
  const s = {};
  s.ship = pcount('ship', 154) / 154 * 15;
  s.obe = OBELISKS.filter(o => PS.c[o[0]]).length / 4 * 4;
  s.clk = PS.c.clock ? 10 : 0;
  s.slay = SLAYER.filter(o => PS.c[o[0]]).length / 12 * 10;
  s.fri = VIL.filter(v => (GS.v[v.id] ? GS.v[v.id].h : 0) >= maxHearts(v)).length / 34 * 11;
  s.lvl = SKILLS.reduce((a, o) => a + clamp(+PS.n[o[0]] || 0, 0, 10), 0) / 50 * 5;
  s.sd = DROPS.filter(o => PS.c[o[0]]).length / 7 * 10;
  s.cook = pcount('cook', 81) / 81 * 10;
  s.craft = pcount('craft', 149) / 149 * 10;
  s.fish = pcount('fish', 72) / 72 * 10;
  s.wal = pcount('wal', 130) / 130 * 5;
  s.total = Object.values(s).reduce((a, b) => a + b, 0);
  return s;
}

    <div class="bar ${S.total >= 99.95 ? 'gold' : ''}"><i style="width:${Math.min(100, S.total)}%"></i></div>
    <div class="ptxt">${S.total >= 99.95 ? '🎉 MÜKEMMELİYET!' : 'Qi\'nin Ceviz Odası\'ndaki Mükemmeliyet Takipçisi ile aynı hesap'}</div></div>
  <div class="note">Aşağıdaki kutuları ve sayaçları kendin güncelle; ilerleme tarayıcında saklanır. Dostluk kısmı <b>Hediyeler</b> sekmesindeki ❤ sayacından otomatik gelir.</div>
  <div class="pgrid">
  ${counter(COUNTERS[0])}
  ${pcard('🗿', 'Çiftlikteki Dikilitaşlar', OBELISKS.filter(o => PS.c[o[0]]).length, 4, 4, `<div class="cks">${OBELISKS.map(o => cbox(o[0], o[1], o[2])).join('')}</div><p class="hint">Büyücü Kulesi\'nden yaptırılır. Kâğıt üstünde pahalı: Muafiyet (Perfection Waiver) almak daha ucuz olabilir.</p>`)}
  ${pcard('🕰️', 'Altın Saat (Gold Clock)', PS.c.clock ? 1 : 0, 1, 10, `<div class="cks">${cbox('clock', 'Çiftliğe Altın Saat inşa et', '10.000.000g — Büyücü\'nden')}</div>`)}
  ${pcard('⚔️', 'Canavar Avcısı Kahramanı', SLAYER.filter(o => PS.c[o[0]]).length, 12, 10, `<div class="cks">${SLAYER.map(o => cbox(o[0], o[1], 'Hedef: ' + o[2] + ' adet')).join('')}</div><p class="hint">Maceracılar Loncası (Marlon). Hedefleri tamamlayınca Marlon\'a uğra.</p>`)}
  ${pcard('🤝', 'Büyük Dostluklar', fr, 34, 11, `<p class="hint">Evlenilebilir köylüler <b>8 ❤</b>, diğerleri <b>10 ❤</b> olmalı (Kent dahil — 1. yılda bitmez). Kalpleri <b>Hediyeler</b> sekmesinde işaretle.</p>
     ${pend.length ? `<div class="pend"><b>Eksik olanlar (${pend.length}):</b> ${pend.map(v => `<span>${v.n} <small>${(GS.v[v.id] ? GS.v[v.id].h : 0)}/${maxHearts(v)}</small></span>`).join('')}</div>` : '<p class="ok">Hepsi tamam! 💖</p>'}
     <button class="go" data-go="gift">Hediyeler sekmesine git →</button>`)}
  ${pcard('📈', 'Çiftçi Seviyesi', SKILLS.reduce((a, o) => a + clamp(+PS.n[o[0]] || 0, 0, 10), 0), 50, 5, `<div class="sk">${SKILLS.map(o => `<div class="skr"><span>${o[1]}</span><button data-sk="${o[0]}" data-d="-1">−</button><b>${clamp(+PS.n[o[0]] || 0, 0, 10)}/10</b><button data-sk="${o[0]}" data-d="1">+</button></div>`).join('')}</div><p class="hint">Beş becerinin hepsi 10. seviye olmalı.</p>`)}
  ${pcard('🌟', 'Yıldızdamlaları', DROPS.filter(o => PS.c[o[0]]).length, 7, 10, `<div class="cks">${DROPS.map(o => cbox(o[0], o[1], o[2])).join('')}</div><p class="hint">Her biri +34 enerji. Toplam 7 tane var. <a target="_blank" rel="noopener" href="${WIKI_TR}Stardrop">Wiki ↗</a></p>`)}
  ${counter(COUNTERS[1])}${counter(COUNTERS[2])}${counter(COUNTERS[3])}${counter(COUNTERS[4])}
  </div>
  <h2 class="sec">🧭 Mükemmeliyet dışında ama lazım olanlar</h2>
  <div class="pgrid">${EXTRAS.map(([t, items]) => `<section class="panel pcard"><div class="ph"><h3>${t}</h3><span class="pv">${items.filter(i => PS.x[i[0]]).length}/${items.length}</span></div><div class="pb"><div class="cks">${items.map(i => cbox(i[0], i[1], i[2], 'x')).join('')}</div></div></section>`).join('')}</div>
  <div class="foot">Mükemmeliyet puanı: Gönderim %15 · Dikilitaş %4 · Altın Saat %10 · Canavar Avcısı %10 · Dostluk %11 · Seviye %5 · Yıldızdamlası %10 · Yemek %10 · Üretim %10 · Balık %10 · Altın Ceviz %5.
  Kaynak: <a target="_blank" rel="noopener" href="https://stardewvalleywiki.com/Perfection">Stardew Valley Wiki – Perfection</a>. Eksiklerini kaydından görmek için <a target="_blank" rel="noopener" href="https://mouseypounds.github.io/stardew-checkup/">Stardew Checkup</a> aracı da işe yarar.</div>`;
}
(function perfEvents() {
  const el = $('#v-perf');
  el.addEventListener('change', e => {
    const t = e.target;
    if (t.dataset.ck) { PS[t.dataset.ns][t.dataset.ck] = t.checked ? 1 : 0; pSave(); const y = scrollY; renderPerf(); scrollTo(0, y); }
    else if (t.dataset.ci) { PS.n[t.dataset.ci] = clamp(Math.round(+t.value || 0), 0, +t.dataset.max); pSave(); const y = scrollY; renderPerf(); scrollTo(0, y); }
  });
  el.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.go) { setView(b.dataset.go); scrollTo(0, 0); return; }
    let k = b.dataset.cn || b.dataset.sk; if (!k) return;
    const max = b.dataset.cn ? COUNTERS.find(c => c[0] === k)[3] : 10;
    PS.n[k] = clamp((+PS.n[k] || 0) + (+b.dataset.d), 0, max); pSave();
    const y = scrollY; renderPerf(); scrollTo(0, y);
  });
})();

setView(view);

</script>
